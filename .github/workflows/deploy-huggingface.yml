name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'docs/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - '.github/workflows/deploy-huggingface.yml'
  workflow_dispatch:
    inputs:
      target_space:
        description: Hugging Face Space receiving this branch
        required: true
        default: modventures/character-studio
        type: string

concurrency:
  group: deploy-huggingface-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HF_SPACE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.target_space || 'modventures/character-studio' }}

jobs:
  validate:
    name: Build before deploying
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci

      # The Space no longer builds the frontend itself; it ships the bundle this
      # step produces, so a broken build stops the deploy here instead.
      - name: Typecheck and build the frontend
        run: npm run build

      - name: Hand the bundle to the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

      - name: Backend regression tests
        run: |
          pip install -r backend/requirements-dev.txt
          PYTHONPATH=backend pytest backend/tests -q

  deploy:
    name: Upload app to Hugging Face
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      # frontend/dist is gitignored in this repo but shipped to the Space, so it
      # comes from the validate job rather than the checkout.
      - name: Fetch the frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy to Hugging Face (non-destructive overlay)
        id: push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          git lfs install
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Clone the existing Space — KEEPS its .gitattributes and LFS config.
          git clone https://x-access-token:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID} hf_workspace

          # The whole monorepo is the Space (root Dockerfile builds frontend +
          # backend + the bundled model service), so stage exactly what the
          # Docker build needs, then mirror it. --delete matters: without it a
          # renamed or removed file lingers on the Space and keeps getting baked
          # into the image.
          rm -rf stage && mkdir stage
          # The repo .gitignore is deliberately NOT shipped: it excludes
          # frontend/dist, which the Space must carry now that the image no
          # longer builds the bundle. The staged tree is the curated set.
          cp -a Dockerfile .dockerignore README.md package.json package-lock.json stage/
          cp -a backend frontend scripts docs stage/
          rm -rf stage/frontend/node_modules \
                 stage/frontend/test-results stage/frontend/playwright-report
          find stage -name '__pycache__' -type d -prune -exec rm -rf {} +

          test -f stage/frontend/dist/index.html \
            || { echo "::error::frontend/dist is missing from the staged tree"; exit 1; }

          rsync -a --checksum --delete --exclude '.git/' --exclude '.gitattributes' stage/ hf_workspace/

          python3 scripts/verify_frontend.py hf_workspace/frontend/dist

          cd hf_workspace

          # Hugging Face rejects raw binaries in git. Its default .gitattributes
          # covers model formats but not image/audio/video, and backend/demo_assets
          # ships the seeded scene. Patterns must exist BEFORE staging, since the
          # LFS clean filter only runs at `git add` time.
          for pattern in '*.png' '*.jpg' '*.jpeg' '*.wav' '*.mp4'; do
            grep -qF "${pattern} filter=lfs" .gitattributes 2>/dev/null \
              || echo "${pattern} filter=lfs diff=lfs merge=lfs -text" >> .gitattributes
          done

          git add -A

          # A stray ignore rule silently dropping the bundle is a build error on
          # the Space, not here, so confirm git actually tracks it.
          git ls-files --error-unmatch frontend/dist/index.html >/dev/null \
            || { echo "::error::frontend/dist was not staged by git"; exit 1; }

          before=$(git rev-parse HEAD)
          git commit -m "Automated Deploy: ${GITHUB_SHA}" || echo "No changes to commit"
          after=$(git rev-parse HEAD)

          # Record what we pushed so the next step waits for exactly that build.
          echo "sha=${after}" >> "$GITHUB_OUTPUT"
          if [ "${before}" = "${after}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Space already up to date at ${after}; nothing to deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git push origin main
          fi

      - name: Wait for the Space to build and restart
        if: steps.push.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet "huggingface_hub>=0.26"
          python3 .github/scripts/wait_for_space.py \
            --space "${HF_SPACE_ID}" \
            --sha "${{ steps.push.outputs.sha }}" \
            --timeout-minutes 40
